name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend against PostgreSQL
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RILL_POSTGRES_ADMIN_PASSWORD: ci-admin-not-for-production
      RILL_MIGRATOR_DB_PASSWORD: ci-migrator-not-for-production
      RILL_APP_DB_PASSWORD: ci-app-not-for-production
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --project=chromium --grep "account result"
        working-directory: frontend
        env:
          E2E_ACCOUNT: "true"
          E2E_BASE_URL: http://127.0.0.1:8080
      - if: always()
        run: docker compose logs --no-color backend web database migrate permissions
      - if: always()
        run: docker compose down --volumes
