spring:
  datasource:
    url: ${RILL_DATABASE_URL}
    username: ${RILL_DATABASE_USERNAME}
    password: ${RILL_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${RILL_DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: ${RILL_DATABASE_MIN_IDLE:0}
      idle-timeout: ${RILL_DATABASE_IDLE_TIMEOUT_MS:60000}
      max-lifetime: ${RILL_DATABASE_MAX_LIFETIME_MS:300000}
  flyway:
    enabled: ${RILL_FLYWAY_ENABLED:false}
    url: ${RILL_FLYWAY_URL:${RILL_DATABASE_URL}}
    user: ${RILL_FLYWAY_USERNAME:${RILL_DATABASE_USERNAME}}
    password: ${RILL_FLYWAY_PASSWORD:${RILL_DATABASE_PASSWORD}}
    connect-retries: ${RILL_FLYWAY_CONNECT_RETRIES:10}
    connect-retries-interval: ${RILL_FLYWAY_CONNECT_RETRIES_INTERVAL:5s}

rill:
  cookie:
    secure: ${RILL_COOKIE_SECURE:true}
  allowed-origins: []
  deployment:
    require-verified-database-tls: ${RILL_REQUIRE_VERIFIED_DATABASE_TLS:true}

logging:
  structured:
    format:
      console: logstash
