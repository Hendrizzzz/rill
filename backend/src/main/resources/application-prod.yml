spring:
  datasource:
    url: ${TYPETHOCK_DATABASE_URL}
    username: ${TYPETHOCK_DATABASE_USERNAME}
    password: ${TYPETHOCK_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${TYPETHOCK_DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: ${TYPETHOCK_DATABASE_MIN_IDLE:0}
      idle-timeout: ${TYPETHOCK_DATABASE_IDLE_TIMEOUT_MS:60000}
      max-lifetime: ${TYPETHOCK_DATABASE_MAX_LIFETIME_MS:300000}
  flyway:
    enabled: ${TYPETHOCK_FLYWAY_ENABLED:false}
    url: ${TYPETHOCK_FLYWAY_URL:${TYPETHOCK_DATABASE_URL}}
    user: ${TYPETHOCK_FLYWAY_USERNAME:${TYPETHOCK_DATABASE_USERNAME}}
    password: ${TYPETHOCK_FLYWAY_PASSWORD:${TYPETHOCK_DATABASE_PASSWORD}}
    connect-retries: ${TYPETHOCK_FLYWAY_CONNECT_RETRIES:10}
    connect-retries-interval: ${TYPETHOCK_FLYWAY_CONNECT_RETRIES_INTERVAL:5s}

typethock:
  cookie:
    secure: ${TYPETHOCK_COOKIE_SECURE:true}
  allowed-origins: []
  deployment:
    require-verified-database-tls: ${TYPETHOCK_REQUIRE_VERIFIED_DATABASE_TLS:true}

logging:
  structured:
    format:
      console: logstash
